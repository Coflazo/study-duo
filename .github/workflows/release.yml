name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build the Chromium and Firefox zips
        run: npx wxt zip && npx wxt zip -b firefox
      - name: Name them and write SHA256SUMS
        run: |
          mkdir dist
          cp build/study-duo-*-chrome.zip dist/study-duo-chromium.zip
          cp build/study-duo-*-firefox.zip dist/study-duo-firefox.zip
          cp build/study-duo-*-sources.zip dist/study-duo-sources.zip
          cd dist && sha256sum study-duo-*.zip > SHA256SUMS && cat SHA256SUMS
      - name: Attest where the zips came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/study-duo-*.zip
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\nInstall or update: see https://coflazo.github.io/study-duo\nCheck a download: `gh attestation verify study-duo-chromium.zip --repo %s`\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Study Duo $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
