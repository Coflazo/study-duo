name: release

on:
  push:
    tags: ['v*.*.*']

# Dependency code (npm ci, tests, the build) runs only in `build`, which can read and nothing else. `attest` signs
# build provenance for the zips and runs no package code. No job can write to the repository: the owner publishes
# the release from these files with scripts/publish-release.sh, so it is authored by them, not by a bot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build the Chromium and Firefox zips
        run: npx wxt zip && npx wxt zip -b firefox
      - name: Name them and write SHA256SUMS
        run: |
          mkdir dist
          cp build/study-duo-*-chrome.zip dist/study-duo-chromium.zip
          cp build/study-duo-*-firefox.zip dist/study-duo-firefox.zip
          cp build/study-duo-*-sources.zip dist/study-duo-sources.zip
          cp helper/study-duo-helper.sh helper/study-duo-helper.ps1 helper/study-duo-helper.bat dist/
          cd dist && sha256sum study-duo-* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {on=1; next} on && (/^## \[/ || /^\[[^]]*\]: /) {exit} on {print}' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
          printf '\nInstall or update: see https://coflazo.github.io/study-duo\nCheck a download: `gh attestation verify study-duo-chromium.zip --repo %s`\n' "$GITHUB_REPOSITORY" >> dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The checksums still match what was built
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Attest where the zips came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/study-duo-*

  # Mozilla signs the Firefox build as unlisted (never shown in its store) so Firefox installs it from the project site.
  # Only this job sees the two AMO keys, and it runs one pinned tool; without the keys it does nothing.
  firefox:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
    steps:
      - name: Keys set?
        if: env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == ''
        run: echo "::notice::No AMO keys (WEB_EXT_API_KEY, WEB_EXT_API_SECRET), so Firefox was not signed."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          name: release
          path: dist
      - name: Sign with Mozilla, unlisted
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          cd dist && sha256sum -c SHA256SUMS && cd ..
          mkdir ff signed && unzip -q dist/study-duo-firefox.zip -d ff
          npx --yes web-ext@10.7.0 sign --channel=unlisted --source-dir ff --artifacts-dir signed --upload-source-code dist/study-duo-sources.zip --approval-timeout 1500000
          mkdir out && cp signed/*.xpi out/study-duo-firefox.xpi && cd out && sha256sum study-duo-firefox.xpi > SHA256SUMS-firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          name: firefox
          path: out/
          if-no-files-found: error
          retention-days: 7

  attest-firefox:
    needs: firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: get
        continue-on-error: true
        with:
          name: firefox
          path: out
      - name: Attest where the signed Firefox file came from
        if: steps.get.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/study-duo-firefox.xpi
